name: Native WebGL Android APK
on:
  push:
    branches: ['feature/native-webgl-v020']
    paths-ignore: ['temp/**', '*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare and verify native game
        run: |
          npm ci
          python3 scripts/extract_music.py
          npm test
          npm run build
      - name: Verify rendering, gameplay, save and music offline
        run: npm run smoke
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore native test signing key
        id: native-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/max-yutnori-debug.keystore
          key: max-yutnori-native-debug-key-v2
      - name: Prepare explicit test signing key
        run: |
          NATIVE_KEYSTORE_PATH="$HOME/.android/max-yutnori-debug.keystore"
          if [ ! -s "$NATIVE_KEYSTORE_PATH" ]; then
            if [ -f temp/native-signing-certificate.pem ]; then
              echo "::error::The cached test signing key is missing. Restore it before building; do not silently replace the published identity."
              exit 1
            fi
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$NATIVE_KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Max YutNori,C=FR"
          fi
          test -s "$NATIVE_KEYSTORE_PATH"
          keytool -exportcert -rfc -keystore "$NATIVE_KEYSTORE_PATH" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/native-signing-certificate.pem"
          if [ -f temp/native-signing-certificate.pem ]; then
            cmp temp/native-signing-certificate.pem "$RUNNER_TEMP/native-signing-certificate.pem"
          fi
          cp "$RUNNER_TEMP/native-signing-certificate.pem" temp/native-signing-certificate.pem
      - name: Save native test signing key
        if: steps.native-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/max-yutnori-debug.keystore
          key: max-yutnori-native-debug-key-v2
      - name: Build and lint Android
        run: gradle -p android --no-daemon assembleDebug bundleDebug lintDebug
      - name: Verify APK and prepare direct download
        run: |
          mkdir -p temp
          cp android/app/build/outputs/apk/debug/app-debug.apk temp/Max-YutNori-v0.6.0-debug.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab temp/Max-YutNori-v0.6.0-debug.aab
          jarsigner -verify temp/Max-YutNori-v0.6.0-debug.aab > temp/native-aab-verification.txt
          keytool -printcert -jarfile temp/Max-YutNori-v0.6.0-debug.aab >> temp/native-aab-verification.txt
          python3 scripts/verify_native_apk.py temp/Max-YutNori-v0.6.0-debug.apk > temp/native-package.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs temp/Max-YutNori-v0.6.0-debug.apk > temp/native-apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging temp/Max-YutNori-v0.6.0-debug.apk | head -30 >> temp/native-apk-verification.txt
          sha256sum temp/Max-YutNori-v0.6.0-debug.apk temp/Max-YutNori-v0.6.0-debug.aab > temp/native-SHA256SUMS
          printf 'Source commit: %s\nBuild run: %s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > temp/native-build-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs temp/Max-YutNori-v0.5.0-debug.apk > temp/native-previous-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, ssl
          def cert(p):
              return next(l for l in Path(p).read_text().splitlines() if 'certificate SHA-256 digest:' in l)
          expected=hashlib.sha256(ssl.PEM_cert_to_DER_cert(Path('temp/native-signing-certificate.pem').read_text())).hexdigest()
          actual=cert('temp/native-apk-verification.txt').split(': ')[-1]
          import re, zipfile
          aab_report=Path('temp/native-aab-verification.txt').read_text()
          assert 'jar verified.' in aab_report
          aab_cert=re.search(r'SHA256: ([0-9A-F:]+)',aab_report).group(1).replace(':','').lower()
          assert aab_cert==expected, 'AAB signature differs from expected key'
          with zipfile.ZipFile('temp/Max-YutNori-v0.6.0-debug.aab') as bundle:
              assert 'base/assets/game/index.html' in bundle.namelist()
              assert not any('/Build/' in n for n in bundle.namelist())
          assert actual==expected, 'APK was signed by an unexpected key'
          same=cert('temp/native-apk-verification.txt')==cert('temp/native-previous-signature.txt')
          assert same, 'Upgrade signature must match 0.5.0'
          with open('temp/native-build-info.txt','a') as f:f.write('Same signing certificate as 0.5.0: '+str(same)+'\n')
          PY
      - name: Expose APK and original music on the work branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/native-* temp/Max-YutNori-v0.6.0-debug.apk temp/Max-YutNori-v0.6.0-debug.aab web/public/audio/arirang.m4a
          git commit -m 'build: expose native Max-YutNori v0.6.0 test APK [skip ci]'
          git push origin "HEAD:$BRANCH_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Max-YutNori-v0.6.0-debug
          path: |
            temp/native-*
            temp/Max-YutNori-v0.6.0-debug.apk
            temp/Max-YutNori-v0.6.0-debug.aab
            android/app/build/reports/lint-results-debug.html

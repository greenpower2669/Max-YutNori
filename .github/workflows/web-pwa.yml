name: Web PWA and Android compatibility
on:
  push:
    branches: ['feature/web-pwa-v010']
    paths-ignore: ['*.md', 'docs/**', 'temp/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Unit tests, original assets and both builds
        run: |
          npm ci
          python3 scripts/verify_branding.py
          npm test
          npm run build
          npm run build:web
      - name: Original gameplay and WebGL regression suite
        run: npm run smoke
      - name: PWA offline, save, worker update and browser checks
        run: node scripts/smoke_pwa.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/max-yutnori-debug.keystore
          key: max-yutnori-native-debug-key-v2
          fail-on-cache-miss: true
      - name: Android APK/AAB build and lint without publication
        run: |
          test -s "$HOME/.android/max-yutnori-debug.keystore"
          gradle -p android --no-daemon assembleDebug bundleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Max-YutNori-Web-PWA-verification
          path: |
            test-results/
            pwa-dist/
            android/app/build/reports/lint-results-debug.html

plugins { id 'com.android.application' }

android {
    namespace 'fr.fab.maxyutnori'
    compileSdk 36
    defaultConfig {
        applicationId 'fr.fab.maxyutnori'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '0.8.6'
    }
    sourceSets { main { assets.srcDirs = ['../../web-dist'] } }
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/max-yutnori-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

plugins { id 'com.android.application' }

android {
    namespace 'fr.fab.maxyutnori'
    compileSdk 36
    defaultConfig {
        applicationId 'fr.fab.maxyutnori'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    sourceSets { main { assets.srcDirs = ['../../web-dist'] } }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
